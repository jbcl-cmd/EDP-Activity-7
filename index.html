<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School of Rock</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="auth-container">
        <main class="auth-card">
            <header class="auth-header">
                <h1>School of Rock</h1>
            <p class="subtitle" style="text-align: center;">Enter your credentials to access the system</p>
            </header>
            <form id="loginForm">
                <div id="loginMessage" style="display:none; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem;"></div>
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder= "" required>
                        <button type="button" class="password-toggle-btn toggle-password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">LOGIN</button>
                
                <div class="auth-links">
                    <a href="recovery.html">Forgot your password?</a>
                    <a href="signup.html">Don't have an account? Sign up</a>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
