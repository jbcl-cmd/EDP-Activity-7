<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery - School of Rock</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="auth-container">
        <main class="auth-card">
            <header class="auth-header">
                <h1>School of Rock</h1>
                <p>Password Recovery</p>
            </header>
            <p class="subtitle" style="text-align: center;"></p>
            
            <form id="recoveryForm">
                <div id="recoveryMessage" style="display:none; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"></div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="" required>
                    </div>
                
                <div class="form-group">
                    <label for="address">Recovery Verification</label>
                    <input type="text" id="address" name="address" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new_password" name="new_password" class="form-control" required>
                        <button type="button" class="password-toggle-btn toggle-password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-bottom: 10px;">RESET PASSWORD</button>
                <a href="index.html" class="btn btn-secondary">Back to Login</a>
            </form>
        </main>
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
