<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - School of Rock</title>
    <meta name="description" content="Generate and export reports for the School of Rock Student Enrollment System.">
    <link rel="stylesheet" href="style.css?v=8">
    <style>
        /* ── Report Module Styles ── */
        .report-controls {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .report-controls .form-group {
            margin-bottom: 0;
            min-width: 200px;
            flex: 1;
        }
        .report-controls .form-group label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .report-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .report-actions .btn {
            width: auto;
            padding: 11px 22px;
            white-space: nowrap;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-export {
            background: #1b6b3a;
            color: white;
        }
        .btn-export:hover {
            background: #15562f;
        }
        .btn-export:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ── DataGrid Area ── */
        .datagrid-container {
            margin-top: 24px;
            display: none;
        }
        .datagrid-container.visible {
            display: block;
            animation: fadeSlideIn 0.4s ease;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .datagrid-toolbar {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .datagrid-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .datagrid-info h3 {
            font-size: 1rem;
            color: var(--maroon-dark);
        }
        .record-count {
            font-size: 0.82rem;
            color: var(--text-secondary);
            background: var(--maroon-pale);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .datagrid-search {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .datagrid-search input {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            background: white;
            width: 240px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .datagrid-search input:focus {
            outline: none;
            border-color: var(--maroon-primary);
            box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.08);
        }
        .table-responsive {
            overflow-x: auto;
        }

        /* ── Loading Spinner ── */
        .report-loading {
            display: none;
            text-align: center;
            padding: 48px 20px;
        }
        .report-loading.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--maroon-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .report-loading p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ── Empty State ── */
        .empty-report {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }
        .empty-report .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-report p {
            font-size: 0.95rem;
        }

        /* ── Toast Notification ── */
        .toast-notification {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--maroon-dark);
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast-notification.success {
            background: #1b6b3a;
        }
        .toast-notification.error {
            background: #c0392b;
        }

        /* ── Report Summary Badge ── */
        .report-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .report-meta span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .report-meta span strong {
            color: var(--maroon-primary);
        }

        /* ── Modal styles (needed for shared script.js) ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(74, 0, 0, 0.45); backdrop-filter: blur(3px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>School of Rock</h2>
                <p>Enrollment System</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="users.html" class="nav-link">Users</a>
                <a href="students.html" class="nav-link">Students</a>
                <a href="reports.html" class="nav-link active">Reports</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="#" class="nav-link logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Report Generator</h2>
                <div class="user-info currentUser">Loading...</div>
            </header>

            <div class="content-area">
                <!-- Report Controls Card -->
                <div class="card">
                    <div class="table-header">
                        <h3>Generate New Report</h3>
                    </div>
                    <div style="padding: 24px;">
                        <form id="reportForm">
                            <div class="report-controls">
                                <div class="form-group">
                                    <label for="reportType">Report Type</label>
                                    <select id="reportType" class="form-control">
                                        <option value="Student Master List">Student Master List</option>
                                        <option value="Enrollment Summary">Enrollment Summary</option>
                                        <option value="User Accounts Report">User Accounts Report</option>
                                    </select>
                                </div>
                                <div class="form-group" id="dateFromGroup">
                                    <label for="dateFrom">Date From</label>
                                    <input type="date" id="dateFrom" class="form-control">
                                </div>
                                <div class="form-group" id="dateToGroup">
                                    <label for="dateTo">Date To</label>
                                    <input type="date" id="dateTo" class="form-control">
                                </div>
                                <div class="report-actions">
                                    <button id="btnGenerateReport" type="button" class="btn btn-primary">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                        GENERATE
                                    </button>
                                    <button id="btnExportExcel" type="button" class="btn btn-export" disabled>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                        EXPORT TO EXCEL
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div class="report-loading" id="reportLoading">
                    <div class="spinner"></div>
                    <p>Generating report, please wait...</p>
                </div>

                <!-- DataGrid Container -->
                <div class="datagrid-container" id="datagridContainer">
                    <div class="card">
                        <div class="datagrid-toolbar">
                            <div class="datagrid-info">
                                <h3 id="datagridTitle">Report Results</h3>
                                <span class="record-count" id="recordCount">0 records</span>
                            </div>
                            <div class="datagrid-search">
                                <input type="text" id="datagridSearch" placeholder="Search records…" oninput="filterDatagrid()">
                            </div>
                        </div>
                        <div class="report-meta" style="padding: 12px 20px; background: #fffcfc; border-bottom: 1px solid var(--border-color);">
                            <span>Report: <strong id="metaType">—</strong></span>
                            <span>Generated: <strong id="metaDate">—</strong></span>
                            <span id="metaRangeContainer" style="display:none;">Period: <strong id="metaRange">—</strong></span>
                        </div>
                        <div class="table-responsive">
                            <table id="reportDatagrid">
                                <thead id="datagridHead">
                                    <!-- Dynamic columns -->
                                </thead>
                                <tbody id="datagridBody">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                        <!-- Empty State -->
                        <div class="empty-report" id="emptyReport" style="display:none;">
                            <span class="icon">📭</span>
                            <p>No records found for this report.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast-notification" id="toastNotification">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">Report exported successfully!</span>
    </div>

    <!-- xlsx-js-style for Excel export with cell formatting -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="script.js?v=8"></script>
</body>
</html>
